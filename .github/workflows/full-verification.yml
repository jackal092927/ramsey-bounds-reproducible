name: full-theorem-verification

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.2'
      - run: uv sync --frozen --no-dev
      - run: .venv/bin/python reproduce.py full
      - run: .venv/bin/python reproduce.py sources
