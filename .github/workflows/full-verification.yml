name: full-theorem-verification

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 peeled commit
        with:
          version: '0.10.2'
      - run: uv sync --frozen --no-dev
      - run: .venv/bin/python reproduce.py full
      - run: .venv/bin/python reproduce.py sources
