name: full-theorem-verification

on:
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 peeled commit
        with:
          version: '0.10.2'
      - run: uv sync --frozen --no-dev
      - run: .venv/bin/python reproduce.py full
      - run: .venv/bin/python reproduce.py sources
