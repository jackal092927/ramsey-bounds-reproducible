name: fast-verification

on:
  push:
  pull_request:

jobs:
  integrity-and-light-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.2'
      - name: Install pinned dependencies
        run: uv sync --frozen --no-dev
      - name: Reproduce headline upper and lower certificates and finite light checks
        run: .venv/bin/python reproduce.py quick
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q reproduce.py routes scripts

  canonical-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install LaTeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Compile the one canonical manuscript
        run: make paper
      - name: Reject unresolved citations and references
        run: python scripts/check_latex_log.py
