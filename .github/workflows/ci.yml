name: fast-verification

on:
  push:
  pull_request:

jobs:
  integrity-and-light-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7 peeled commit
        with:
          version: '0.10.2'
      - name: Install pinned dependencies
        run: uv sync --frozen --no-dev
      - name: Reproduce headline upper and lower certificates and finite light checks
        run: .venv/bin/python reproduce.py quick
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q reproduce.py routes scripts

  canonical-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.15'
      - name: Install LaTeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - name: Compile the one canonical manuscript
        run: make paper
      - name: Reject unresolved citations and references
        run: python scripts/check_latex_log.py
      - name: Upload compiled quantum manuscript
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quantum-ramsey-manuscript-${{ github.sha }}
          path: papers/quantum/main.pdf
          if-no-files-found: error
          retention-days: 14
