name: normalized-itcs-check

on:
  push:
    branches:
      - chatgpt/normalized-itcs-final-polish-2026-09-03
  workflow_dispatch:

jobs:
  build-normalized-itcs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - name: Compile normalized persistence manuscript
        working-directory: research/quantum_direction_selection/collaboration/2026-09-02/manuscript_v0
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Reject unresolved references and typesetting warnings
        working-directory: research/quantum_direction_selection/collaboration/2026-09-02/manuscript_v0
        run: |
          ! grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations|Overfull \\hbox|Overfull \\vbox" main.log
          pdfinfo main.pdf
          pdffonts main.pdf
      - name: Upload review PDF and log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normalized-itcs-${{ github.sha }}
          path: |
            research/quantum_direction_selection/collaboration/2026-09-02/manuscript_v0/main.pdf
            research/quantum_direction_selection/collaboration/2026-09-02/manuscript_v0/main.log
          if-no-files-found: error
          retention-days: 14
